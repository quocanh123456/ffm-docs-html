<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=/crm/settings/cau-hinh-pipeline">
<title>Cấu hình Pipeline — đã chuyển sang trang mới</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --ink: #0f172a; --ink2: #475569; --ink3: #94a3b8; --line: #e6e8f0;
    --blue: #2563eb; --blue-bg: #eff4ff; --green: #059669; --green-bg: #ecfdf5; --amber: #b45309; --amber-bg: #fffbeb;
    --red: #dc2626; --red-bg: #fef2f2; --violet: #7c3aed; --violet-bg: #f5f3ff; --slate-bg: #f1f5f9;
    /* màu theo sản phẩm */
    --ffm: #0ea5e9; --crm: #8b5cf6; --pos: #10b981; --bigate: #e11d48; --pid: #f97316;
    --radius: 14px; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.6 -apple-system, "SF Pro Text", "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--blue); text-decoration: none; }
  code { font: 12.5px/1.4 "SF Mono", ui-monospace, Menlo, monospace; background: var(--slate-bg); color: #334155; padding: 1px 6px; border-radius: 6px; }

  /* Thanh mục lục dính trên đầu */
  .top { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(180%) blur(12px); background: rgba(245,246,250,.82); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1180px; margin: 0 auto; padding: 10px 28px; display: flex; align-items: center; gap: 18px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .logo i { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, var(--ffm), var(--crm)); display: inline-block; }
  .nav { display: flex; gap: 4px; overflow-x: auto; }
  .nav a { color: var(--ink2); font-size: 13px; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .nav a:hover { background: #e8ebf3; color: var(--ink); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 28px 90px; }

  /* Phần mở đầu + thẻ số liệu */
  .hero { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%); color: #fff; border-radius: 20px; padding: 30px 34px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,.45), transparent 70%); }
  .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #c7d2fe; font-weight: 600; }
  .hero h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 10px; letter-spacing: -.01em; }
  .hero p { color: #cbd5e1; max-width: 760px; margin: 0; }
  .hero .meta { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; position: relative; z-index: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,.14); }
  .chip a { color: #fff; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
  .kpi { background: var(--card); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  .kpi b { display: block; font-size: 22px; letter-spacing: -.01em; }
  .kpi span { color: var(--ink2); font-size: 13px; }

  /* Mục */
  section { margin-top: 44px; scroll-margin-top: 70px; }
  .sec-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .sec-h .n { font: 600 12px/1 "SF Mono", ui-monospace, monospace; color: var(--blue); background: var(--blue-bg); padding: 5px 8px; border-radius: 8px; }
  .sec-h h2 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
  .sec-h p { margin: 0; color: var(--ink2); font-size: 13.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; }
  .caption { color: var(--ink2); font-size: 13px; margin: 14px 2px 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }

  /* Nhãn trạng thái */
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .p-ok { color: var(--green); background: var(--green-bg); }
  .p-mid { color: var(--amber); background: var(--amber-bg); }
  .p-bad { color: var(--red); background: var(--red-bg); }
  .p-info { color: var(--blue); background: var(--blue-bg); }
  .p-new { color: var(--violet); background: var(--violet-bg); }

  /* Danh sách hiện trạng */
  .status { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 300px 1fr; gap: 18px; align-items: start; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line); background: #fff; }
  .row h4 { margin: 0 0 6px; font-size: 14px; }
  .row p { margin: 0; color: var(--ink2); }

  /* Sơ đồ kiến trúc: khối theo sản phẩm + mũi tên có nhãn */
  .arch { display: grid; grid-template-columns: 1fr 104px 1.4fr 104px 1fr; align-items: stretch; }
  .zone { border-radius: 16px; padding: 16px; }
  .zone .zt { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 12px; }
  .zone .zt i { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 13px; }
  .z-pid { background: #fff7ed; border: 1px solid #fed7aa; } .z-pid .zt i { background: var(--pid); }
  .z-ffm { background: #f0f9ff; border: 1px solid #bae6fd; } .z-ffm .zt i { background: var(--ffm); }
  .z-crm { background: #f5f3ff; border: 1px solid #ddd6fe; } .z-crm .zt i { background: var(--crm); }
  .z-pos { background: #ecfdf5; border: 1px solid #a7f3d0; } .z-pos .zt i { background: var(--pos); }
  .z-bigate { background: #fff1f2; border: 1px solid #fecdd3; } .z-bigate .zt i { background: var(--bigate); }
  .tile { background: #fff; border-radius: 10px; padding: 9px 12px; margin-top: 8px; border: 1px solid rgba(15,23,42,.06); box-shadow: 0 1px 2px rgba(15,23,42,.05); }
  .tile b { display: block; font-size: 13px; }
  .tile small { color: var(--ink2); font-size: 12px; }
  .link { display: flex; flex-direction: column; justify-content: center; gap: 38px; padding: 0 10px; }
  .arrow { position: relative; height: 2px; background: linear-gradient(90deg, #cbd5e1, #64748b); border-radius: 2px; }
  .arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border-left: 7px solid #64748b; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .arrow.back { background: linear-gradient(270deg, #cbd5e1, #64748b); }
  .arrow.back::after { right: auto; left: -1px; border-left: none; border-right: 7px solid #64748b; }
  .arrow em { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; font-style: normal; font-size: 11px; line-height: 1.3; color: var(--ink2); text-align: center; width: 92px; }

  /* Thẻ quyết định */
  .dec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .dcard { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
  .dcard .q { font-size: 12px; font-weight: 700; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase; }
  .dcard h4 { margin: 0; font-size: 15px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--green-bg); border: 1px solid #a7f3d0; }
  .choice .ck { flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
  .choice.open { background: var(--violet-bg); border-color: #ddd6fe; } .choice.open .ck { background: var(--violet); }
  .alt { font-size: 12.5px; color: var(--ink3); padding-left: 2px; }

  /* Khối ghi chú: cảnh báo / rủi ro / thông tin */
  .note { border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .note .ic { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; }
  .n-warn { background: var(--amber-bg); border: 1px solid #fde68a; } .n-warn .ic { background: #f59e0b; }
  .n-red { background: var(--red-bg); border: 1px solid #fecaca; } .n-red .ic { background: var(--red); }
  .n-info { background: var(--blue-bg); border: 1px solid #bfdbfe; } .n-info .ic { background: var(--blue); }
  .note p { margin: 0; } .note p + p { margin-top: 6px; }
  ul.clean { margin: 0; padding-left: 18px; color: var(--ink2); } ul.clean li { margin: 5px 0; }

  /* Cây (tổ chức, danh mục, quan hệ cha–con) */
  .node { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
  .node .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; }
  .node b { font-size: 13.5px; display: block; line-height: 1.2; }
  .node small { color: var(--ink2); font-size: 11.5px; }
  .node.alt2 { background: #faf5ff; border-color: #e9d5ff; }
  .t-ul { list-style: none; margin: 0; padding-left: 26px; }
  .t-ul li { position: relative; padding: 7px 0 0 18px; }
  .t-ul li::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 2px solid #dbe1ec; }
  .t-ul li:last-child::before { bottom: auto; height: 27px; }
  .t-ul li::after { content: ""; position: absolute; left: 0; top: 27px; width: 16px; border-top: 2px solid #dbe1ec; }

  /* Thẻ bảng dữ liệu (schema) */
  .schema { display: grid; gap: 12px; }
  .tbl { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; }
  .tbl .th { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; background: #0f172a; color: #fff; font: 600 13px/1.3 "SF Mono", ui-monospace, monospace; }
  .tbl .th span { font: 600 11px/1 -apple-system, sans-serif; padding: 3px 8px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .tbl .th.new { background: linear-gradient(90deg, #6d28d9, #8b5cf6); }
  .f { display: grid; grid-template-columns: 200px 1fr auto; gap: 10px; padding: 6px 12px; border-top: 1px solid #f1f3f8; font-size: 12.5px; align-items: center; }
  .f code { background: none; padding: 0; font-weight: 600; color: var(--ink); }
  .f small { color: var(--ink2); }
  .f.isnew { background: #faf7ff; }

  /* Bảng thường */
  table.t { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  table.t th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink3); font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 11px 12px; border-bottom: 1px solid #f1f3f8; vertical-align: top; }
  table.t tr:last-child td { border-bottom: none; }
  table.t td.num { color: var(--ink2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Lộ trình theo phase */
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); }
  .phase { padding: 0 8px; position: relative; }
  .phase::before { content: ""; position: absolute; top: 16px; left: 0; right: 0; height: 2px; background: #dbe1ec; z-index: 1; }
  .phase:first-child::before { left: 50%; } .phase:last-child::before { right: 50%; }
  .phase .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; position: relative; z-index: 2; font-size: 13px; margin: 0 auto; }
  .phase.cur .dot { box-shadow: 0 0 0 5px rgba(37,99,235,.18); }
  .phase h4 { text-align: center; margin: 10px 0 4px; font-size: 13.5px; }
  .phase p { text-align: center; margin: 0; color: var(--ink2); font-size: 12.5px; }
  .phase .who { display: block; text-align: center; margin-top: 6px; }

  /* Các bước của plan */
  .steps { counter-reset: s; display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .step::before { counter-increment: s; content: counter(s); width: 30px; height: 30px; border-radius: 9px; background: var(--slate-bg); color: var(--ink); font-weight: 700; display: grid; place-items: center; font-size: 13px; }
  .step.you::before { background: #fff7ed; color: var(--amber); }
  .step h5 { margin: 0 0 2px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .step .v { color: var(--ink2); font-size: 13px; }
  .step .v b { color: #047857; font-weight: 500; }
  .dep { font-size: 11.5px; font-weight: 600; color: var(--ink2); background: var(--slate-bg); padding: 1px 8px; border-radius: 999px; }
  .dep.par { color: var(--blue); background: var(--blue-bg); }
  .dep.you { color: var(--amber); background: var(--amber-bg); }

  /* Dải bước tuần tự (deploy, luồng ngắn) */
  .pipe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; align-items: stretch; }
  .pipe .s { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
  .pipe .s:not(:last-child)::after { content: "→"; position: absolute; right: -18px; top: 50%; transform: translateY(-50%); color: var(--ink3); font-size: 15px; }
  .pipe .s b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--slate-bg); font-size: 11px; margin-bottom: 4px; }
  .pipe .s.you { border-color: #fde68a; background: var(--amber-bg); }
  .pipe .s small { display: block; color: var(--ink2); font-size: 11.5px; }

  /* Luồng nhiều bên (thay sequence diagram): mỗi bên 1 cột, mỗi bước 1 hàng */
  .seq { display: grid; grid-template-columns: 40px repeat(3, 1fr); gap: 8px 10px; align-items: center; }
  .seq .hd { text-align: center; font-weight: 700; font-size: 13px; padding: 8px; border-radius: 10px; color: #fff; }
  .seq .no { width: 26px; height: 26px; border-radius: 8px; background: var(--slate-bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .seq .msg { grid-column: var(--from) / var(--to); position: relative; text-align: center; font-size: 12.5px; color: var(--ink); padding: 6px 10px 10px; }
  .seq .msg::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 2px; height: 2px; background: #64748b; border-radius: 2px; }
  .seq .msg::before { content: ""; position: absolute; bottom: -2px; right: 12%; border-left: 7px solid #64748b; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
  .seq .msg.rev::before { right: auto; left: 12%; border-left: none; border-right: 7px solid #64748b; }
  .seq .msg.err { color: var(--red); } .seq .msg.err::after { background: var(--red); } .seq .msg.err::before { border-left-color: var(--red); border-right-color: var(--red); }


  /* Prototype màn hình (giống giao diện antd của FFM / Bigate), thao tác được */
  .proto { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; overflow: clip; box-shadow: var(--shadow); background: #fff; position: relative; }
  .proto .bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #f1f3f8; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink2); }
  .proto .bar i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; background: #e2e8f0; }
  .proto .bar span { margin-left: 10px; background: #fff; border-radius: 6px; padding: 2px 10px; flex: 1; max-width: 420px; }
  .app { display: grid; grid-template-columns: 208px 1fr; min-height: 430px; font-size: 13px; }
  .side { background: #001529; color: #c9d1dc; padding: 12px 0; }
  .side .brand { display: flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; padding: 4px 16px 14px; }
  .side .brand b { width: 22px; height: 22px; border-radius: 6px; background: var(--ffm); display: grid; place-items: center; font-size: 11px; }
  .side a { display: block; padding: 8px 16px 8px 20px; color: #c9d1dc; cursor: pointer; }
  .side a:hover { color: #fff; }
  .side a.on { background: #1677ff; color: #fff; }
  .main { background: #f5f5f5; padding: 16px 18px; }
  .ph { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ph h3 { margin: 0; font-size: 16px; }
  .btn { border: 1px solid #d9d9d9; background: #fff; border-radius: 6px; padding: 5px 14px; font-size: 13px; cursor: pointer; color: rgba(0,0,0,.88); }
  .btn:hover { border-color: #4096ff; color: #4096ff; }
  .btn.pri { background: #1677ff; border-color: #1677ff; color: #fff; }
  .btn.pri:hover { background: #4096ff; color: #fff; }
  .panel { background: #fff; border-radius: 8px; padding: 12px; }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid #f0f0f0; margin-bottom: 10px; }
  .tabs a { padding: 6px 0; cursor: pointer; color: rgba(0,0,0,.65); border-bottom: 2px solid transparent; }
  .tabs a.on { color: #1677ff; border-color: #1677ff; }
  .tabs a sup { background: #f0f0f0; border-radius: 10px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
  .search { border: 1px solid #d9d9d9; border-radius: 6px; padding: 5px 10px; width: 240px; font-size: 13px; margin-bottom: 10px; }
  table.ant { width: 100%; border-collapse: collapse; }
  table.ant th { background: #fafafa; text-align: left; font-weight: 600; padding: 9px 10px; border-bottom: 1px solid #f0f0f0; }
  table.ant td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; }
  table.ant tr:hover td { background: #fafafa; }
  .sw { width: 36px; height: 20px; border-radius: 10px; background: #bfbfbf; position: relative; cursor: pointer; display: inline-block; transition: .2s; vertical-align: middle; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .sw.on { background: #1677ff; } .sw.on::after { left: 18px; }
  .sw.lock { opacity: .4; cursor: not-allowed; }
  .changed { outline: 2px dashed var(--violet); outline-offset: 3px; border-radius: 6px; }
  .changed-tip { position: absolute; font-size: 11px; color: var(--violet); background: var(--violet-bg); border-radius: 6px; padding: 1px 6px; }
  .mask { position: absolute; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 5; }
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 340px; background: #fff; z-index: 6; transform: translateX(105%); visibility: hidden; transition: transform .25s, visibility .25s; padding: 18px; box-shadow: -6px 0 16px rgba(0,0,0,.08); }
  .proto.open .mask { display: block; } .proto.open .drawer { transform: none; visibility: visible; }
  .drawer h4 { margin: 0 0 14px; font-size: 15px; }
  .fld { margin-bottom: 12px; } .fld label { display: block; font-size: 12.5px; margin-bottom: 4px; }
  .fld label em { color: #ff4d4f; font-style: normal; }
  .fld input, .fld select { width: 100%; border: 1px solid #d9d9d9; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .fld.err input { border-color: #ff4d4f; } .fld .msg { color: #ff4d4f; font-size: 12px; display: none; } .fld.err .msg { display: block; }
  .toast { position: absolute; top: 52px; left: 50%; transform: translate(-50%, -10px); background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 8px 14px; font-size: 13px; opacity: 0; transition: .25s; z-index: 9; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast::before { content: "✓"; color: #52c41a; font-weight: 700; margin-right: 8px; }
  .toast.bad::before { content: "✕"; color: #ff4d4f; }

  pre { background: #0f172a; color: #e2e8f0; border-radius: 12px; padding: 14px 16px; font: 12.5px/1.6 "SF Mono", ui-monospace, monospace; overflow-x: auto; margin: 10px 0 0; }

  @media (max-width: 960px) {
    .arch, .dec, .kpis, .grid2, .phases, .pipe { grid-template-columns: 1fr; }
    .link { flex-direction: row; padding: 10px 0; } .row { grid-template-columns: 1fr; }
    .pipe .s:not(:last-child)::after { display: none; }
  }
</style>
</head>
